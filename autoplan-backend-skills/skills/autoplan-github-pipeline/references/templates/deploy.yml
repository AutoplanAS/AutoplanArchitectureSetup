name: Deploy integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployDevInfra:
        description: Deploy dev infrastructure
        required: true
        type: boolean
        default: true
      deployProdInfra:
        description: Deploy prod infrastructure
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  BUILD_CONFIGURATION: Release
  PROJECT_PATH: <Integration>.csproj
  TEST_PROJECT_PATH: <Integration>.Tests/<Integration>.Tests.csproj
  DEV_RESOURCE_GROUP: rg-<integration>-dev
  PROD_RESOURCE_GROUP: rg-<integration>-prod
  LOCATION: norwayeast
  DEV_FUNCTION_APP: <integration>-dev-func
  PROD_FUNCTION_APP: <integration>-prod-func

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore app
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Restore tests
        run: dotnet restore "${{ env.TEST_PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-build

      - name: Publish function app
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --output out/function-app --no-build

      - name: Zip function app artifact
        run: |
          cd out/function-app
          zip -r ../function-app.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: out/function-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: infra
          path: infra/

  deploy-dev-infra:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deployDevInfra)
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: infra
          path: infra

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate dev infra
        run: |
          az group create --name "${{ env.DEV_RESOURCE_GROUP }}" --location "${{ env.LOCATION }}"
          az deployment group validate \
            --resource-group "${{ env.DEV_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters.dev.bicepparam \
            --parameters apiKey='${{ secrets.DEV_API_KEY }}'

      - name: Deploy dev infra
        run: |
          az deployment group create \
            --resource-group "${{ env.DEV_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters.dev.bicepparam \
            --parameters apiKey='${{ secrets.DEV_API_KEY }}'

  deploy-dev-app:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-dev-infra
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.deployDevInfra ||
        needs.deploy-dev-infra.result == 'success' ||
        needs.deploy-dev-infra.result == 'skipped'
      )
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-app
          path: out

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/functions-action@v1
        with:
          app-name: ${{ env.DEV_FUNCTION_APP }}
          package: out/function-app.zip

  deploy-prod-infra:
    runs-on: ubuntu-latest
    needs: deploy-dev-app
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deployProdInfra)
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: infra
          path: infra

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate prod infra
        run: |
          az group create --name "${{ env.PROD_RESOURCE_GROUP }}" --location "${{ env.LOCATION }}"
          az deployment group validate \
            --resource-group "${{ env.PROD_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters.prod.bicepparam \
            --parameters apiKey='${{ secrets.PROD_API_KEY }}'

      - name: Deploy prod infra
        run: |
          az deployment group create \
            --resource-group "${{ env.PROD_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters.prod.bicepparam \
            --parameters apiKey='${{ secrets.PROD_API_KEY }}'

  deploy-prod-app:
    runs-on: ubuntu-latest
    needs:
      - deploy-dev-app
      - deploy-prod-infra
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.deployProdInfra ||
        needs.deploy-prod-infra.result == 'success' ||
        needs.deploy-prod-infra.result == 'skipped'
      )
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-app
          path: out

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/functions-action@v1
        with:
          app-name: ${{ env.PROD_FUNCTION_APP }}
          package: out/function-app.zip
