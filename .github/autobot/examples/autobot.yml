name: autobot-router

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  spec:
    if: github.event.issue.state == 'open' && github.event.label.name == 'autobot-ready-for-spec'
    uses: AutoplanAS/AutoplanArchitectureSetup/.github/workflows/autobot-spec.yml@v1
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}

  plan:
    if: github.event.issue.state == 'open' && github.event.label.name == 'autobot-implementing'
    uses: AutoplanAS/AutoplanArchitectureSetup/.github/workflows/autobot-plan.yml@v1
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}

  implement:
    if: github.event.issue.state == 'open' && github.event.label.name == 'autobot-in-review'
    uses: AutoplanAS/AutoplanArchitectureSetup/.github/workflows/autobot-implement.yml@v1
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}

