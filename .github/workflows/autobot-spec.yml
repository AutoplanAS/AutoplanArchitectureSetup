name: autobot-spec

on:
  workflow_call:
    inputs:
      repository:
        description: Target repository in owner/repo form
        required: true
        type: string
      issue_number:
        description: Feature issue number
        required: true
        type: number
      actor:
        description: User that triggered the label event
        required: true
        type: string
      default_branch:
        description: Target repository default branch
        required: true
        type: string
      project_owner:
        description: Project owner login for stage sync
        required: false
        type: string
      project_number:
        description: Project number for stage sync
        required: false
        type: string
      project_status_field:
        description: Project status field name for stage sync
        required: false
        type: string
        default: Status
      spec_provider:
        description: Provider for spec phase (codex or github-copilot)
        required: false
        type: string
        default: codex
      copilot_assignee:
        description: GitHub login to assign in Copilot mode
        required: false
        type: string
      copilot_timeout_minutes:
        description: Copilot polling timeout in minutes
        required: false
        type: string
        default: "90"
      copilot_strict_artifact:
        description: Require explicit completed artifact payloads before acceptance
        required: false
        type: string
        default: "false"
    secrets:
      CODEX_API_KEY:
        required: false
      BASELINE_REPO_TOKEN:
        required: false
      AUTOBOT_PROJECT_TOKEN:
        required: false
      AUTOBOT_SPEC_ARTIFACTS_WRITE_SAS:
        required: false
      AUTOBOT_SPEC_ARTIFACTS_READ_SAS:
        required: false
      AUTOBOT_COPILOT_TRIGGER_TOKEN:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: autobot-${{ inputs.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Bootstrap baseline tooling
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}
          BASELINE_REPOSITORY: ${{ vars.AUTOBOT_BASELINE_REPOSITORY != '' && vars.AUTOBOT_BASELINE_REPOSITORY || 'AutoplanAS/AutoplanArchitectureSetup' }}
          BASELINE_REF: ${{ vars.AUTOBOT_BASELINE_REF != '' && vars.AUTOBOT_BASELINE_REF || 'v1' }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          baseline_repo="${BASELINE_REPOSITORY:-AutoplanAS/AutoplanArchitectureSetup}"
          baseline_ref="${BASELINE_REF:-v1}"
          if [[ -n "${BASELINE_REPO_TOKEN:-}" ]]; then
            export GH_TOKEN="$BASELINE_REPO_TOKEN"
          fi
          if ! gh repo clone "$baseline_repo" .autobot-baseline -- --depth 1 --branch "$baseline_ref"; then
            export GH_TOKEN="$GITHUB_TOKEN"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Autobot could not read baseline tooling repository ($baseline_repo@$baseline_ref). If the baseline repository is private, pass BASELINE_REPO_TOKEN with read access. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label autobot-ready-for-spec --add-label autobot-blocked || true
            exit 0
          fi

      - name: Install skill packages
        run: |
          set -euo pipefail
          bash .autobot-baseline/machinist/scripts/install-autoplan-skills.sh --targets codex,copilot --install-blueprint

      - name: Run spec phase
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ACTOR: ${{ inputs.actor }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          TRIGGER_LABEL: autobot-ready-for-spec
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PROJECT_STATUS_FIELD: ${{ inputs.project_status_field }}
          AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}
          AUTOBOT_SPEC_PROVIDER: ${{ inputs.spec_provider }}
          AUTOBOT_COPILOT_ASSIGNEE: ${{ inputs.copilot_assignee }}
          AUTOBOT_COPILOT_TRIGGER_HANDLE: ${{ vars.AUTOBOT_COPILOT_TRIGGER_HANDLE }}
          AUTOBOT_COPILOT_TRIGGER_TOKEN: ${{ secrets.AUTOBOT_COPILOT_TRIGGER_TOKEN }}
          AUTOBOT_COPILOT_SPEC_AUTOCOMPLETE_WAIT_MINUTES: ${{ vars.AUTOBOT_COPILOT_SPEC_AUTOCOMPLETE_WAIT_MINUTES != '' && vars.AUTOBOT_COPILOT_SPEC_AUTOCOMPLETE_WAIT_MINUTES || '20' }}
          AUTOBOT_COPILOT_TIMEOUT_MINUTES: ${{ inputs.copilot_timeout_minutes }}
          AUTOBOT_COPILOT_STRICT_ARTIFACT: ${{ inputs.copilot_strict_artifact }}
          AUTOBOT_SPEC_ARTIFACTS_ENABLED: ${{ vars.AUTOBOT_SPEC_ARTIFACTS_ENABLED != '' && vars.AUTOBOT_SPEC_ARTIFACTS_ENABLED || 'false' }}
          AUTOBOT_SPEC_ARTIFACTS_STORAGE_ACCOUNT: ${{ vars.AUTOBOT_SPEC_ARTIFACTS_STORAGE_ACCOUNT }}
          AUTOBOT_SPEC_ARTIFACTS_CONTAINER: ${{ vars.AUTOBOT_SPEC_ARTIFACTS_CONTAINER }}
          AUTOBOT_SPEC_ARTIFACTS_PREFIX: ${{ vars.AUTOBOT_SPEC_ARTIFACTS_PREFIX != '' && vars.AUTOBOT_SPEC_ARTIFACTS_PREFIX || 'autobot-spec' }}
          AUTOBOT_SPEC_ARTIFACTS_ENDPOINT_SUFFIX: ${{ vars.AUTOBOT_SPEC_ARTIFACTS_ENDPOINT_SUFFIX != '' && vars.AUTOBOT_SPEC_ARTIFACTS_ENDPOINT_SUFFIX || 'blob.core.windows.net' }}
          AUTOBOT_SPEC_ARTIFACTS_WRITE_SAS: ${{ secrets.AUTOBOT_SPEC_ARTIFACTS_WRITE_SAS }}
          AUTOBOT_SPEC_ARTIFACTS_READ_SAS: ${{ secrets.AUTOBOT_SPEC_ARTIFACTS_READ_SAS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .autobot-baseline/.github/autobot/scripts/run_spec_phase.sh
