name: autobot-setup

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in owner/repo form (defaults to current repository)
        required: false
        type: string

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Configure labels
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOBOT_SETUP_TOKEN != '' && secrets.AUTOBOT_SETUP_TOKEN || github.token }}
          INPUT_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          repo="$INPUT_TARGET_REPOSITORY"
          if [[ -z "$repo" ]]; then
            repo="$CURRENT_REPOSITORY"
          fi

          gh label create autobot-ready-for-spec --repo "$repo" --color 1D76DB --description "Feature is ready for design generation" --force
          gh label create autobot-creating-specification --repo "$repo" --color 5319E7 --description "Design exists and awaits human review" --force
          gh label create autobot-review-specification --repo "$repo" --color C5DEF5 --description "Final design review before implementation planning" --force
          gh label create autobot-ready-to-implement --repo "$repo" --color 0E8A16 --description "Specification approved and ready for task planning" --force
          gh label create autobot-task --repo "$repo" --color FBCA04 --description "Task issue generated for implementation" --force
          gh label create autoboot --repo "$repo" --color FBCA04 --description "Compatibility task marker label for autobot-generated implementation tasks" --force
          gh label create autobot-implementing --repo "$repo" --color D4C5F9 --description "Task implementation is in progress" --force
          gh label create autobot-in-review --repo "$repo" --color B60205 --description "Implementation is complete and awaits human PR review" --force
          gh label create autobot-done --repo "$repo" --color 0E8A16 --description "Implementation PR merged; task completed" --force
          gh label create autobot-blocked --repo "$repo" --color D93F0B --description "Needs human decision before continuing" --force
