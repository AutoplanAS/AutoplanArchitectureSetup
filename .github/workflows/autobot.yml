name: autobot-router

on:
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  phase-trigger-permission:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && (github.event.label.name == 'autobot-ready-for-spec' || github.event.label.name == 'autobot-ready-to-implement' || github.event.label.name == 'autobot-in-review')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check trigger actor permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || true)"
          if [[ -z "$permission" ]]; then
            permission="none"
          fi

          case "$permission" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Reject unauthorized trigger
        if: steps.permission.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Autobot ignored \`$TRIGGER_LABEL\` from @$ACTOR because only users with write/maintain/admin access can start an Autobot phase."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$TRIGGER_LABEL" --add-label autobot-blocked || true

  copilot-complete:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    uses: ./.github/workflows/autobot-copilot-complete.yml
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
      default_branch: ${{ github.event.repository.default_branch }}
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
      spec_provider: ${{ vars.AUTOBOT_SPEC_PROVIDER != '' && vars.AUTOBOT_SPEC_PROVIDER || 'codex' }}
      plan_provider: ${{ vars.AUTOBOT_PLAN_PROVIDER != '' && vars.AUTOBOT_PLAN_PROVIDER || 'codex' }}
      implement_provider: ${{ vars.AUTOBOT_IMPLEMENT_PROVIDER != '' && vars.AUTOBOT_IMPLEMENT_PROVIDER || 'codex' }}
      copilot_assignee: ${{ vars.AUTOBOT_COPILOT_ASSIGNEE }}
      copilot_strict_artifact: ${{ vars.AUTOBOT_COPILOT_STRICT_ARTIFACT != '' && vars.AUTOBOT_COPILOT_STRICT_ARTIFACT || 'false' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}

  sync-ready-for-spec:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-ready-for-spec' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Ready for spec
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-creating-specification:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-creating-specification'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Creating specification
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-review-specification:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-review-specification'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Review specification
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-ready-to-implement:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-ready-to-implement' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Ready to implement
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-in-review:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-in-review' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: In review
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-blocked:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-blocked'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Blocked
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-task-opened:
    if: github.event_name == 'issues' && github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'autobot-task')
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Ready to implement
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  sync-done:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    uses: ./.github/workflows/autobot-project-sync.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      project_stage: Done
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
    secrets:
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  spec:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-ready-for-spec' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-spec.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
      spec_provider: ${{ vars.AUTOBOT_SPEC_PROVIDER != '' && vars.AUTOBOT_SPEC_PROVIDER || 'codex' }}
      copilot_assignee: ${{ vars.AUTOBOT_COPILOT_ASSIGNEE }}
      copilot_timeout_minutes: ${{ vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES != '' && vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES || '90' }}
      copilot_strict_artifact: ${{ vars.AUTOBOT_COPILOT_STRICT_ARTIFACT != '' && vars.AUTOBOT_COPILOT_STRICT_ARTIFACT || 'false' }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  plan:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-ready-to-implement' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-plan.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
      plan_provider: ${{ vars.AUTOBOT_PLAN_PROVIDER != '' && vars.AUTOBOT_PLAN_PROVIDER || 'codex' }}
      copilot_assignee: ${{ vars.AUTOBOT_COPILOT_ASSIGNEE }}
      copilot_timeout_minutes: ${{ vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES != '' && vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES || '90' }}
      copilot_strict_artifact: ${{ vars.AUTOBOT_COPILOT_STRICT_ARTIFACT != '' && vars.AUTOBOT_COPILOT_STRICT_ARTIFACT || 'false' }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}

  implement:
    needs: phase-trigger-permission
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open' && github.event.label.name == 'autobot-in-review' && needs.phase-trigger-permission.outputs.allowed == 'true'
    uses: ./.github/workflows/autobot-implement.yml
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      default_branch: ${{ github.event.repository.default_branch }}
      project_owner: ${{ vars.AUTOBOT_PROJECT_OWNER }}
      project_number: ${{ vars.AUTOBOT_PROJECT_NUMBER }}
      project_status_field: ${{ vars.AUTOBOT_PROJECT_STATUS_FIELD != '' && vars.AUTOBOT_PROJECT_STATUS_FIELD || 'Status' }}
      implement_provider: ${{ vars.AUTOBOT_IMPLEMENT_PROVIDER != '' && vars.AUTOBOT_IMPLEMENT_PROVIDER || 'codex' }}
      copilot_assignee: ${{ vars.AUTOBOT_COPILOT_ASSIGNEE }}
      copilot_timeout_minutes: ${{ vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES != '' && vars.AUTOBOT_COPILOT_TIMEOUT_MINUTES || '90' }}
      copilot_strict_artifact: ${{ vars.AUTOBOT_COPILOT_STRICT_ARTIFACT != '' && vars.AUTOBOT_COPILOT_STRICT_ARTIFACT || 'false' }}
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}
      AUTOBOT_PROJECT_TOKEN: ${{ secrets.AUTOBOT_PROJECT_TOKEN }}
